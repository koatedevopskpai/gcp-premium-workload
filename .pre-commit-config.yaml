# =============================================================================
# Pre-commit Configuration — Code Quality & Security Gates
# =============================================================================
# ARCHITECTURE DECISION: Pre-commit hooks prevent common issues from
# reaching PR review. Every developer must run these locally before pushing.
#
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files

repos:
  # -----------------------------------------------------------------------
  # General-purpose formatting and security
  # -----------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
        # SECURITY SAFEGUARD: Scans for accidentally committed keys
      - id: mixed-line-ending
        args: [--fix=lf]

  # -----------------------------------------------------------------------
  # Terraform formatting and validation
  # -----------------------------------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.4
    hooks:
      - id: terraform_fmt
        args:
          - --args=-recursive
      - id: terraform_validate
        args:
          - --args=-no-color
          - --init-args=-backend=false
      - id: terraform_tflint
        args:
          - --args=--config=.tflint.hcl
      - id: terraform_checkov
        args:
          - --args=--config-file .checkov.yml
      - id: terraform_docs
        args:
          - --args=--output-file README.md --output-mode inject
        # ARCHITECTURE DECISION: terraform_docs generates module documentation
        # from variable and output descriptions. This keeps README in sync
        # with the code.

  # -----------------------------------------------------------------------
  # Shell script linting
  # -----------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: \.sh$

  # -----------------------------------------------------------------------
  # Go code quality (for Terratest files)
  # -----------------------------------------------------------------------
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        files: ^tests/
      - id: go-vet
        files: ^tests/

  # -----------------------------------------------------------------------
  # Secret scanning — additional layer beyond detect-private-key
  # -----------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # ARCHITECTURE DECISION: A secrets baseline file allows known
        # false positives (test keys, placeholder values) while still
        # blocking new secrets.

  # -----------------------------------------------------------------------
  # Markdown linting for ADRs and runbooks
  # -----------------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--disable, MD013, MD024]
        files: ^docs/

  # -----------------------------------------------------------------------
  # JSON/YAML validation for observability configs
  # -----------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: \.(yaml|yml)$
